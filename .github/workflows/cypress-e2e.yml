name: 🧪 Pruebas E2E (Cypress)

on:
  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar y migrar Backend
        run: |
          cd backend
          npm install
          npx prisma generate
          npx prisma migrate deploy
          npm run seed
          npm run build
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db?schema=public
          JWT_SECRET: test_secret_cypress
          NODE_ENV: test

      - name: Instalar y compilar Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_API_URL: http://localhost:3000/api

      - name: Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          # ✅ FORZAMOS las variables en el comando start usando 'bash -c'
          # Esto ignora cualquier archivo .env y obliga a usar la DB de prueba
          start: bash -c "DATABASE_URL=postgresql://postgres:password@localhost:5432/test_db?schema=public JWT_SECRET=test_secret_cypress NODE_ENV=test CLIENT_URL=http://localhost:4173 npm --prefix ../backend start", npm run preview
          wait-on: 'http://localhost:3000/api/health, http://localhost:4173'
          wait-on-timeout: 90
        env:
          # Las dejamos aquí también por si acaso
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db?schema=public
          JWT_SECRET: test_secret_cypress
          NODE_ENV: test
          CLIENT_URL: http://localhost:4173
