name: 🧪 Pruebas E2E (Cypress)

on:
  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar y migrar Backend
        run: |
          cd backend
          npm install
          npx prisma generate
          npx prisma migrate deploy
          npm run seed
          npm run build
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/test_db?schema=public
          JWT_SECRET: test_secret_cypress
          NODE_ENV: test

      - name: Instalar y compilar Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_API_URL: http://127.0.0.1:3000/api

      - name: Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          # ✅ Forzamos las variables directamente en el comando de inicio del backend
          start: bash -c "DATABASE_URL=postgresql://postgres:password@127.0.0.1:5432/test_db?schema=public JWT_SECRET=test_secret_cypress NODE_ENV=test CLIENT_URL=http://127.0.0.1:4173 npm --prefix ../backend start", npm run preview -- --host 127.0.0.1
          wait-on: 'http://127.0.0.1:3000/api/health, http://127.0.0.1:4173'
          wait-on-timeout: 120
        env:
          # Las dejamos aquí también por si el test runner de Cypress las necesita
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/test_db?schema=public
          JWT_SECRET: test_secret_cypress
          NODE_ENV: test
          CLIENT_URL: http://127.0.0.1:4173
          VITE_API_URL: http://127.0.0.1:3000/api
          CYPRESS_BASE_URL: http://127.0.0.1:4173
